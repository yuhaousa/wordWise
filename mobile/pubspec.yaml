name: english_learning_app
description: English learning app for teens and students — words, sentences, quizzes.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Networking & state
  http: ^1.2.1
  provider: ^6.1.2

  # Local storage
  shared_preferences: ^2.2.3

  # Audio / TTS
  flutter_tts: 4.0.2

  # UI
  google_fonts: ^6.2.1
  percent_indicator: ^4.2.3

  # Utilities
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
